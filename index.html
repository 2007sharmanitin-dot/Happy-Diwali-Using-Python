<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Diwali</title>
<style>
body {
  background: #16072e;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 50px 10px;
}
h1 {
  color: gold;
  font-size: 42px;
}
h2 { color: hotpink; }
.card {
  border: 2px solid gold;
  border-radius: 20px;
  padding: 25px 10px;
  max-width: 550px;
  margin: auto;
}
.diya { font-size: 45px; }
button {
  padding: 12px 20px;
  background: gold;
  border: none;
  border-radius: 20px;
  cursor: pointer;
}
</style>
</head>
<body>
<div class="card">
  <div class="diya">🎆 ✨ 🎇</div>
  <h1>HAPPY DIWALI!</h1>
  <h2>Festival of Lights 🪔</h2>
  <p>May your life shine with happiness, success, love and prosperity!</p>
  <div class="diya">🪔 🪔 🪔</div>
  <br>
  <button onclick="alert('Wishing you a Happy Diwali! ✨')">
    Celebrate Diwali ✨
  </button>
  <p>Made with ❤️ by Nitin</p>
</div>
</body>
</html>
